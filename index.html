<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YPTT TI Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p>Memproses data...</p>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <h1>YPTT TI Tracker</h1>
      <p class="subtitle">Monitoring Site TI - Sulawesi &amp; Kalimantan 2026</p>
    </div>
  </header>

  <!-- Tab Navigation -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="site-sul">Site SUL</button>
    <button class="tab-btn" data-tab="site-kal">Site KAL</button>
    <button class="tab-btn" data-tab="pivot">Pivot Data</button>
  </nav>

  <main class="container">

    <!-- ==================== TAB DASHBOARD ==================== -->
    <section id="tab-dashboard" class="tab-panel active">
      <div class="kpi-grid" id="kpiGrid"></div>

      <div class="card">
        <h2>Assignment per Bulan per Zona</h2>
        <div class="chart-wrap">
          <canvas id="mosChart"></canvas>
        </div>
      </div>

      <div class="card">
        <h2>Dashboard 2026 (sheet asli)</h2>
        <div class="table-scroll">
          <table id="dash2026Table" class="data-table compact"></table>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h2>Ringkasan Sulawesi</h2>
          <div class="table-scroll">
            <table id="dashSulTable" class="data-table compact"></table>
          </div>
        </div>
        <div class="card">
          <h2>Pivot Kalimantan</h2>
          <div class="table-scroll">
            <table id="pivotKalTable" class="data-table compact"></table>
          </div>
        </div>
      </div>
    </section>

    <!-- ==================== TAB SITE SUL ==================== -->
    <section id="tab-site-sul" class="tab-panel">
      <div class="toolbar">
        <label for="zoneFilter-site-sul">Filter Zona:</label>
        <select id="zoneFilter-site-sul" class="select"><option value="">-- Semua --</option></select>
        <input type="text" id="search-site-sul" class="input" placeholder="Cari...">
        <span id="count-site-sul" class="badge"></span>
        <button class="btn btn-primary" onclick="showAddModal('site-sul')">+ Tambah</button>
        <button class="btn btn-secondary" onclick="loadSheet('site-sul')">Refresh</button>
        <button class="btn btn-secondary" onclick="toggleFilterPanel('site-sul')">Filter Kolom</button>
      </div>
      <div class="card filter-panel hidden" id="filterPanel-site-sul"></div>
      <div class="card table-card">
        <div class="table-scroll">
          <table id="table-site-sul" class="data-table"></table>
        </div>
        <div class="pagination" id="pagination-site-sul"></div>
      </div>
    </section>

    <!-- ==================== TAB SITE KAL ==================== -->
    <section id="tab-site-kal" class="tab-panel">
      <div class="toolbar">
        <label for="zoneFilter-site-kal">Filter Zona:</label>
        <select id="zoneFilter-site-kal" class="select"><option value="">-- Semua --</option></select>
        <input type="text" id="search-site-kal" class="input" placeholder="Cari...">
        <span id="count-site-kal" class="badge"></span>
        <button class="btn btn-primary" onclick="showAddModal('site-kal')">+ Tambah</button>
        <button class="btn btn-secondary" onclick="loadSheet('site-kal')">Refresh</button>
        <button class="btn btn-secondary" onclick="toggleFilterPanel('site-kal')">Filter Kolom</button>
      </div>
      <div class="card filter-panel hidden" id="filterPanel-site-kal"></div>
      <div class="card table-card">
        <div class="table-scroll">
          <table id="table-site-kal" class="data-table"></table>
        </div>
        <div class="pagination" id="pagination-site-kal"></div>
      </div>
    </section>

    <!-- ==================== TAB PIVOT DATA ==================== -->
    <section id="tab-pivot" class="tab-panel">
      <div class="toolbar">
        <label for="pivotSelect">Pilih Tabel:</label>
        <select id="pivotSelect" class="select">
          <option value="pvt-dash-sul">Pivot SUL (Pvt Dash Sul)</option>
          <option value="pivot-kal">Pivot KAL (Pivot Kal)</option>
          <option value="dash-sul">Dashboard Sulawesi</option>
        </select>
        <h2 id="pivotTitle" style="margin:0;font-size:1rem;">Pivot SUL</h2>
      </div>
      <div class="toolbar">
        <input type="text" id="search-pvt-dash-sul" class="input" placeholder="Cari...">
        <span id="count-pvt-dash-sul" class="badge"></span>
        <button class="btn btn-primary" id="addPivotBtn" onclick="showAddModal('pvt-dash-sul')">+ Tambah</button>
        <button class="btn btn-secondary" onclick="loadSheet(state.activePivot)">Refresh</button>
        <button class="btn btn-secondary" onclick="toggleFilterPanel(state.activePivot)">Filter Kolom</button>
      </div>
      <div class="card filter-panel hidden" id="filterPanel-active"></div>
      <div class="card table-card">
        <div class="table-scroll">
          <table id="table-active" class="data-table"></table>
        </div>
        <div class="pagination" id="pagination-active"></div>
      </div>
    </section>

  </main>

  <!-- Modal Tambah/Edit/Detail -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Data</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="dataForm"></form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" id="btnSave" onclick="saveForm()">Simpan</button>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    YPTT TI Tracker &copy; 2026 &mdash; Data source: Google Spreadsheet
  </footer>

  <script src="script.js"></script>
</body>
</html>
